<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<title>
Pre-op Visit
</title>


<style>

body{

font-family: Arial;
background:#f5f7fa;
padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:12px;
max-width:600px;
margin:auto;

}


input, textarea, select{

width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;

}


button{

background:#1976d2;
color:white;
padding:12px;
border:none;
border-radius:8px;
width:100%;
font-size:16px;

}


h1{

text-align:center;

}

.section{

margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:10px;

}


</style>


</head>


<body>


<h1>
📝 บันทึกผู้ป่วยก่อนผ่าตัด
<br>
Pre-operative Visit
</h1>



<div class="card">


<div class="section">

<h3>
ข้อมูลผู้ป่วย
</h3>


<label>HN</label>
<input>


<label>ชื่อผู้ป่วย</label>
<input>


<label>อายุ</label>
<input type="number">


<label>Ward</label>

<select>

<option>ศัลยกรรม</option>
<option>อายุรกรรม</option>
<option>สูติ-นรีเวช</option>
<option>อื่น ๆ</option>

</select>


<label>Diagnosis</label>
<textarea></textarea>


<label>Operation</label>
<textarea></textarea>


</div>



<div class="section">

<h3>
Surgical Safety Checklist
</h3>


<label>
<input type="checkbox">
 Informed Consent
</label>

<br>


<label>
<input type="checkbox">
 ID Band ถูกต้อง
</label>


<br>


<label>
<input type="checkbox">
 Surgical Site Marking
</label>


<br>


<label>
<input type="checkbox">
 นำของมีค่า/ฟันปลอมออก
</label>


</div>



<div class="section">

<h3>
การเตรียมผู้ป่วย
</h3>


<label>
<input type="checkbox">
 NPO
</label>


<br>


<label>
<input type="checkbox">
 ทำความสะอาดร่างกาย
</label>


<br>


<label>
<input type="checkbox">
 เตรียมความพร้อมอื่น ๆ
</label>


</div>



<div class="section">


<h3>
คำแนะนำก่อนผ่าตัด
</h3>


<label>
<input type="checkbox">
 งดน้ำงดอาหาร
</label>


<br>


<label>
<input type="checkbox">
 การดูแลร่างกาย
</label>


<br>


<label>
<input type="checkbox">
 Early Ambulation
</label>


</div>



<br>


<button>

💾 บันทึก Pre-op

</button>



</div>


</body>

</html>
